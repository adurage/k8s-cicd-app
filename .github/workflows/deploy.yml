name: Build and Push

on:
  push:
    branches: [ main ]

jobs:
  build:
    # runs-on: ubuntu-latest
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # - name: Build image
      #   run: docker build -t anushkadarr/k8s-cicd-app:latest .

      # - name: Push image
      #   run: docker push anushkadarr/k8s-cicd-app:latest

      # # - name: Deploy to cluster
      # #   run: kubectl apply -f k8s/deployment.yml  
      # - name: Deploy to cluster
      #   run: kubectl apply -f k8s/  

      - name: Build image
        run: docker build -t anushkadarr/k8s-cicd-app:${{ github.sha }} .

      - name: Push image
        run: docker push anushkadarr/k8s-cicd-app:${{ github.sha }}

      - name: Deploy to cluster
        run: |
          kubectl set image deployment/k8s-cicd-app \
            k8s-cicd-app=anushkadarr/k8s-cicd-app:${{ github.sha }}